name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Format, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Coverage
        # Coverage threshold: 80% lines across all files (see bunfig.toml [test].coverageThreshold)
        # bun test --coverage exits 1 in bun ≤ 1.x regardless of results (upstream bug),
        # so we capture the output and enforce the threshold ourselves.
        run: |
          output=$(bun test --coverage 2>&1) || true  # bun --coverage always exits 1 (upstream bug)
          echo "$output"
          pct=$(echo "$output" | awk '/^All files/ {gsub(/%/,"",$6); print $6}')
          echo "Line coverage: ${pct}%"
          if [ -z "$pct" ]; then
            echo "Could not parse coverage output" && exit 1
          fi
          threshold=80
          if awk "BEGIN{exit !($pct < $threshold)}"; then
            echo "Coverage ${pct}% is below the required ${threshold}%" && exit 1
          fi
          echo "Coverage ${pct}% meets the required ${threshold}% threshold."
